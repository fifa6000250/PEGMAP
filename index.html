<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Satellite Pegman Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--card:#fff;--ink:#202124;--teal:#00798c}
@media (prefers-color-scheme:dark){:root{--card:#2b2d31;--ink:#e8eaed;--teal:#4fc3d6}}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,"Noto Sans Thai",sans-serif;background:#0b2a4a;-webkit-user-select:none;user-select:none}
#map{position:absolute;inset:0;z-index:0;background:#0b2a4a}
.leaflet-bottom.leaflet-right{margin-bottom:10px}
.leaflet-top.leaflet-right{margin-top:calc(env(safe-area-inset-top,0px) + 52px)}
.leaflet-control-layers{font:600 12px system-ui,sans-serif;border-radius:10px}
.io{align-items:center;position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:5;display:flex;gap:8px}
.io button{background:var(--card);color:var(--ink);border:0;border-radius:16px;padding:8px 14px;font:600 12px system-ui,sans-serif;box-shadow:0 1px 4px #0005;cursor:pointer}
.avatar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#e0916b,#8c5a8a);z-index:5;pointer-events:none}
#explore{width:34px;height:34px;border-radius:50%;background:#000d;box-shadow:0 1px 4px #0005;flex:none}
#peg{width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:grab;background:#333;border-radius:50%;touch-action:none}
.pegman{width:14px;height:24px;position:relative;pointer-events:none}
.pegman i{position:absolute;display:block;background:#f6a21a}
.pegman .h{left:3px;top:0;width:8px;height:8px;border-radius:50%}
.pegman .b{left:2px;top:8px;width:10px;height:10px;border-radius:3px}
.pegman .l{left:3px;top:17px;width:3px;height:7px}
.pegman .r{left:8px;top:17px;width:3px;height:7px}
#ghost{position:fixed;z-index:20;pointer-events:none;display:none;transform:translate(-50%,-50%)}
#ghost .spot{position:absolute;left:-14px;top:14px;width:26px;height:26px;border-radius:50%;background:#4caf5099;border:1px solid #2e7d3299}
#ghost .pegman{position:absolute;left:-7px;top:-8px;transform-origin:7px 0}
.placed{position:fixed;z-index:6;transform:translate(-50%,-100%);cursor:grab;touch-action:none;padding:4px 10px;display:flex;flex-direction:column;align-items:center}
.placed .spot{position:absolute;left:50%;transform:translateX(-50%);bottom:-2px;width:30px;height:12px;border-radius:50%;background:#4caf5099;border:1px solid #2e7d3299}
.tag,.gtag{background:var(--card);color:var(--ink);border-radius:12px;font:600 12px/1 inherit;font-family:inherit;padding:5px 10px;box-shadow:0 1px 4px #0005;margin-bottom:4px;text-align:center;box-sizing:border-box}
.tag{width:96px;border:0;outline:none;cursor:text;-webkit-user-select:text;user-select:text}
.tag:focus{box-shadow:0 0 0 2px var(--teal)}
#ghost .gtag{position:absolute;left:0;top:-40px;transform:translateX(-50%);white-space:nowrap}
@media (pointer:coarse){
  #explore,#peg{width:42px;height:42px}
  #peg .pegman{transform:scale(1.4)}
  .leaflet-bottom.leaflet-right{margin-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
  .placed{padding:12px 18px}
  .tag{font-size:16px;width:110px}
}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 2px 8px #0005;opacity:0;transition:.3s;z-index:30;pointer-events:none;max-width:80%;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="map"></div>
<div class="avatar"></div>
<div class="io"><button id="exp">Save file</button><button id="imp">Load file</button><input type="file" id="file" accept=".json,application/json" hidden><div id="explore"><div id="peg"><div class="pegman"><i class="h"></i><i class="b"></i><i class="l"></i><i class="r"></i></div></div></div></div>
<div id="ghost"><div class="gtag" id="gtag"></div><div class="spot"></div><div class="pegman"><i class="h"></i><i class="b"></i><i class="l"></i><i class="r"></i></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var toast=document.getElementById('toast');
  function say(t){toast.textContent=t;toast.classList.add('on');clearTimeout(say.t);say.t=setTimeout(function(){toast.classList.remove('on')},3500)}
  if(typeof L==='undefined'){say('Could not load the map library. Check your internet connection.');return}

  // ---- real satellite map (Esri World Imagery) ----
  var map=L.map('map',{zoomControl:false,attributionControl:false,minZoom:2,maxZoom:18,worldCopyJump:true,zoomSnap:0.5}).setView([30,100],4);
  L.control.zoom({position:'bottomright'}).addTo(map);
  L.control.attribution({position:'bottomleft',prefix:false}).addTo(map);
  var sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    maxNativeZoom:18,maxZoom:18,
    attribution:'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'
  });
  var labels=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:18,opacity:.9});
  var satGroup=L.layerGroup([sat,labels]).addTo(map);
  var street=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:18,attribution:'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, FAO, NOAA, USGS, OpenStreetMap contributors, and the GIS User Community'});
  L.control.layers({'Satellite':satGroup,'Street map':street},null,{position:'topright',collapsed:false}).addTo(map);
  var warned=false;
  sat.on('tileerror',function(){if(!warned){warned=true;say('Some satellite tiles failed to load. Check your internet connection.')}});

  // ---- placed pegmen are pinned to map coordinates ----
  var all=[];
  function place(d){
    var p=map.latLngToContainerPoint(d._ll),sz=map.getSize();
    var wp=256*Math.pow(2,map.getZoom());
    var dx=p.x-sz.x/2;dx=((dx+wp/2)%wp+wp)%wp-wp/2;
    d.style.left=(sz.x/2+dx)+'px';d.style.top=p.y+'px';
  }
  function placeAll(){all.forEach(place)}
  map.on('move zoom viewreset moveend zoomend resize',placeAll);

  // ---- pegman: swing, drag, place, name ----
  var ghost=document.getElementById('ghost'),peg=document.getElementById('peg');
  var gp=document.querySelector('#ghost .pegman'),dragging=false,a=0,w=0,lastX=null,raf=0;
  var current=null,count=0,dragName='',yoff=0;
  function moveGhost(e){
    if(lastX!==null){w+=-(e.clientX-lastX)*0.5}
    lastX=e.clientX;
    ghost.style.left=e.clientX+'px';ghost.style.top=(e.clientY-yoff)+'px';
  }
  function loop(){
    w+=-0.06*a;w*=0.96;a+=w;a=Math.max(-80,Math.min(80,a));
    gp.style.transform='rotate('+a+'deg)';
    raf=requestAnimationFrame(loop);
  }
  function makePlaced(name){
    var d=document.createElement('div');d.className='placed';
    d.innerHTML='<input class="tag" maxlength="16" spellcheck="false"><div class="spot"></div><div class="pegman"><i class="h"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>';
    var t=d.querySelector('.tag');t.value=name;
    t.addEventListener('pointerdown',function(e){e.stopPropagation()});
    t.addEventListener('keydown',function(e){e.stopPropagation();if(e.key==='Enter')t.blur()});
    t.addEventListener('blur',function(){if(!t.value.trim())t.value=name;save()});
    d.addEventListener('pointerdown',function(e){startDrag(e,d)});
    document.body.appendChild(d);all.push(d);
    return d;
  }
  function startDrag(e,el){
    e.preventDefault();
    current=el||null;
    yoff=(e.pointerType==='touch')?60:0;
    dragName=el?el.querySelector('.tag').value:'Pegman '+(count+1);
    document.getElementById('gtag').textContent=dragName;
    if(current)current.style.display='none';
    dragging=true;ghost.style.display='block';
    lastX=null;a=35;w=0;moveGhost(e);loop();document.body.style.cursor='grabbing';
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
  }
  function onMove(e){if(dragging)moveGhost(e)}
  function onUp(e){
    if(!dragging)return;
    dragging=false;cancelAnimationFrame(raf);ghost.style.display='none';
    document.body.style.cursor='';
    window.removeEventListener('pointermove',onMove);
    window.removeEventListener('pointerup',onUp);
    var r=peg.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
      if(current){current.remove();all.splice(all.indexOf(current),1)}
      current=null;save();return;
    }
    var isNew=!current;
    var p=current||makePlaced(dragName);if(isNew)count++;
    p._ll=map.containerPointToLatLng(L.point(e.clientX,e.clientY-yoff+30));
    place(p);p.style.display='flex';
    if(isNew&&!yoff){var ti=p.querySelector('.tag');ti.focus();ti.select()}
    current=null;save();
  }
  peg.addEventListener('pointerdown',function(e){startDrag(e,null)});

  // ---- saving: auto-saves in this browser, plus save/load as a file ----
  var KEY='satellite-pegmen-v1';
  function snapshot(){return all.map(function(d){return {name:d.querySelector('.tag').value,lat:d._ll.lat,lng:d._ll.lng}})}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(snapshot()))}catch(e){}}
  function restore(list){
    if(!Array.isArray(list))return;
    list.forEach(function(it){
      if(!it||typeof it.lat!=='number'||typeof it.lng!=='number')return;
      var d=makePlaced(String(it.name||'Pegman').slice(0,16));
      d._ll=L.latLng(it.lat,it.lng);place(d);d.style.display='flex';count++;
    });
  }
  try{restore(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
  document.getElementById('exp').onclick=function(){
    var b=new Blob([JSON.stringify(snapshot(),null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pegmen.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  };
  document.getElementById('imp').onclick=function(){document.getElementById('file').click()};
  document.getElementById('file').onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){try{restore(JSON.parse(r.result));save();say('Loaded')}catch(err){say('Could not read that file')}};
    r.readAsText(f);e.target.value='';
  };
})();
</script>
</body>
</html>
